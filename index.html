<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Банка для Сони</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Marck+Script&family=Manrope:wght@400;600&display=swap">
<style>
/* Layout: одна сцена — стеклянная банка с записками по центру, под ней развёрнутая записка. Розово-белый, как основной сайт. Одна светлая тема намеренно. */
:root{
  --paper:#fff4f1;
  --peach:#ffe3d6;
  --lilac:#f1e2f7;
  --blush:#fde4ec;
  --rose:#e8739b;
  --rose-deep:#c24d78;
  --ink:#4a2d3a;
  --muted:#9a7887;
  --glass:rgba(255,255,255,.55);
  --glass-edge:rgba(194,77,120,.28);
  --note:#fffdf8;
  --f-display:"Lora",Georgia,serif;
  --f-hand:"Marck Script","Segoe Script",cursive;
  --f-ui:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100%;background:var(--paper);background-image:radial-gradient(circle at 15% 5%,var(--peach),transparent 45%),radial-gradient(circle at 90% 45%,var(--lilac),transparent 45%),radial-gradient(circle at 20% 95%,var(--blush),transparent 45%);background-attachment:fixed;color:var(--ink);font-family:var(--f-display);padding-inline:20px}
main{max-width:560px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.kicker{font-family:var(--f-ui);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--f-hand);font-weight:400;font-size:clamp(46px,12vw,72px);line-height:1.05;margin:0;color:var(--rose);text-wrap:balance}
.hint{margin:0;font-style:italic;color:var(--muted)}

.jar-btn{background:none;border:0;padding:0;cursor:pointer;position:relative;width:min(260px,70vw);-webkit-tap-highlight-color:transparent}
.jar-btn:focus-visible{outline:2px solid var(--rose-deep);outline-offset:8px;border-radius:24px}
.jar-btn svg{width:100%;height:auto;display:block;overflow:visible}
.jar-btn.shake svg{animation:shake .5s ease}
@keyframes shake{20%{transform:rotate(-5deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.label-text{font-family:var(--f-hand);font-size:22px;fill:var(--rose-deep)}

.counter{font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums;margin:0}

.note-wrap{min-height:190px;width:100%;display:flex;justify-content:center;align-items:flex-start}
.note{position:relative;width:min(420px,100%);background:var(--note);border-radius:4px;padding:30px 26px 24px;box-shadow:0 14px 34px rgba(194,77,120,.16),0 1px 3px rgba(74,45,58,.08);transform-origin:top center}
.note::before{content:"";position:absolute;inset:10px 10px auto;height:1px;background:repeating-linear-gradient(90deg,var(--blush) 0 6px,transparent 6px 12px)}
.note.pop{animation:unfold .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes unfold{0%{transform:translateY(-60px) scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.note .num{font-family:var(--f-ui);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin:0 0 10px}
.note p.txt{margin:0;font-size:20px;line-height:1.55;text-wrap:balance}
.empty{font-style:italic;color:var(--muted);margin:30px 0 0}

.done{display:flex;flex-direction:column;gap:12px;align-items:center}
.done p{margin:0}
.done .big{font-family:var(--f-hand);font-size:32px;color:var(--rose-deep);line-height:1.2}
.btn{font-family:var(--f-ui);font-weight:600;font-size:15px;color:#fff;background:var(--rose);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 8px 22px rgba(232,115,155,.32)}
.btn:hover{background:var(--rose-deep)}
.btn:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}

@media (prefers-reduced-motion:reduce){.jar-btn.shake svg,.note.pop{animation:none}}
</style>

</head><body>
<main>
  <p class="kicker">для Сони</p>
  <h1>Почему я тебя люблю</h1>
  <p class="hint">нажми на банку и достань записку</p>

  <button class="jar-btn" id="jar" type="button" aria-label="Достать записку из банки">
    <svg viewBox="0 0 260 320" aria-hidden="true">
      <defs>
        <clipPath id="inside"><path d="M52 92 Q40 104 40 130 L40 272 Q40 300 70 300 L190 300 Q220 300 220 272 L220 130 Q220 104 208 92 Z"/></clipPath>
        <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <!-- lid -->
      <rect x="62" y="48" width="136" height="30" rx="8" fill="#e8739b"/>
      <rect x="62" y="48" width="136" height="10" rx="5" fill="#f3a9c4"/>
      <rect x="56" y="76" width="148" height="16" rx="6" fill="#fde4ec" stroke="rgba(194,77,120,.28)"/>
      <!-- body -->
      <path d="M52 92 Q40 104 40 130 L40 272 Q40 300 70 300 L190 300 Q220 300 220 272 L220 130 Q220 104 208 92 Z" fill="rgba(255,255,255,.55)" stroke="rgba(194,77,120,.28)" stroke-width="2"/>
      <g id="notes" clip-path="url(#inside)"></g>
      <path d="M58 110 Q50 130 50 160 L50 250" stroke="url(#shine)" stroke-width="10" stroke-linecap="round" fill="none"/>
      <!-- label -->
      <rect x="72" y="176" width="116" height="52" rx="6" fill="#fffdf8" stroke="rgba(194,77,120,.35)"/>
      <text x="130" y="209" text-anchor="middle" class="label-text">для зайки</text>
    </svg>
  </button>

  <p class="counter" id="counter"></p>

  <div class="note-wrap" id="noteWrap" aria-live="polite">
    <p class="empty">здесь появится записка</p>
  </div>
</main>

<script>
// Пример записок. Замени на свои, их можно сколько угодно.
var REASONS = [
"Потому что ты веришь в меня даже тогда, когда я сам в себя не верю.",

"Потому что ты фоткаешь нас в каждом зеркале, и я делаю вид, что мне всё равно. Мне не всё равно.",
"Потому что в розовом ты самая красивая. Хотя и не в розовом тоже.",

"Потому что я хочу увидеть Париж именно с тобой.",
"Потому что ты смеёшься так, что я сам начинаю улыбаться.",
"Потому что с тобой я становлюсь лучше.",
"Потому что ты заботишься обо мне, даже когда сама устала.",
"Потому что мне больше никто не нужен. Вообще никто.",
"Потому что ты моя самая нежная привычка.",
"Потому что ты остаёшься самым важным человеком в моей жизни.",
"Потому что я до сих пор не могу поверить, что ты моя.",
"Потому что ты пахнешь как дом.",
"Потому что с тобой можно молчать, и это не неловко.",
"Потому что ты замечаешь мелочи, которые другие не видят.",
"Потому что ты красивая по утрам, даже когда говоришь, что нет.",
"Потому что твои обнимашки лечат лучше любых таблеток.",
"Потому что ты умеешь радоваться простым вещам.",
"Потому что ты честная, даже когда это сложно.",
"Потому что с тобой каждая поездка становится воспоминанием.",
"Потому что ты знаешь меня лучше, чем я сам.",
"Потому что ты не сдаёшься.",
"Потому что ты делаешь меня спокойнее.",
"Потому что ты мой лучший друг.",
"Потому что твоя улыбка поднимает мне настроение за секунду.",
"Потому что ты смешно злишься.",
"Потому что с тобой не страшно мечтать о большом.",
"Потому что ты умеешь прощать, и я это очень ценю.",
"Потому что ты делаешь обычный вечер особенным.",

"Потому что ты смотришь на меня так, как никто не смотрит.",

"Потому что ты нежная, но с характером.",
"Потому что мне нравится, как ты произносишь моё имя.",
"Потому что наши маски в ванной — это лучшие вечера.",
"Потому что ты красишь мою жизнь в розовый.",

"Потому что рядом с тобой я чувствую себя дома, где бы мы ни были.",

"Потому что ты не даёшь мне расслабиться и идёшь вперёд вместе со мной.",

"Потому что у нас свои шутки, которые понимаем только мы.",

"Потому что ты держишь меня за руку так, будто это важно. Это важно.",

"Потому что с тобой хочется строить планы на годы вперёд.",
"Потому что ты делаешь меня смелее.",

"Потому что ты умеешь быть и маленькой девочкой, и взрослой женщиной.",

"Потому что ты помнишь то, что важно для меня.",
"Потому что ты мне доверяла, и я хочу быть этого достоин.",
"Потому что с тобой я знаю, чего хочу от жизни.",
"Потому что ты светишься, когда счастлива.",
"Потому что ты добрая к людям.",
"Потому что ты моя зайка.",
"Потому что ты мой пупсик.",
"Потому что я скучаю по тебе, даже когда ты в соседней комнате.",
"Потому что ты делаешь фото, которые я пересматриваю по сто раз.",
"Потому что с тобой я не боюсь будущего.",
"Потому что ты умеешь сказать правду мягко.",
"Потому что твои глаза — моё любимое место.",
"Потому что ты всегда знаешь, как меня успокоить.",
"Потому что ты любишь меня не за что-то, а просто так.",
"Потому что ты делаешь меня счастливым в самые обычные дни.",
"Потому что мне нравится смотреть, как ты собираешься.",
"Потому что ты ценишь мои старания.",
"Потому что ты красиво танцуешь, даже когда дурачишься.",
"Потому что ты мой самый тёплый человек.",
"Потому что ты помогаешь мне становиться взрослее.",
"Потому что с тобой хочется быть лучшей версией себя.",
"Потому что ты целуешь так, что я забываю обо всём.",
"Потому что ты верная.",
"Потому что ты умеешь ждать.",
"Потому что ты мой дом.",
"Потому что каждый наш день — это маленькая история.",
"Потому что ты делаешь меня счастливым просто тем, что ты есть.",
"Потому что я люблю тебя в пижаме так же, как в платье.",
"Потому что ты не отпускаешь меня, когда мне тяжело.",
"Потому что ты — мой самый правильный выбор.",
"Потому что ты делишься со мной последним кусочком.",
"Потому что я хочу, чтобы у нас было ещё тысячу зеркальных фото.",
"Потому что без тебя всё не то.",
"Потому что я хочу прожить с тобой всю жизнь.",
"Потому что ты — это ты. И другой такой нет.",
"Потому что я люблю тебя. Просто люблю."

var COLORS=["#f3a9c4","#fde4ec","#fff3c9","#e8739b","#ffd9e6","#fbe7f0","#ffe8cf"];
var notesG=document.getElementById('notes');
var order=[], drawn=0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function reset(){order=shuffle(REASONS.map(function(_,i){return i}));drawn=0;drawJar();updateCounter()}
function drawJar(){
  var remaining=REASONS.length-drawn, ns="http://www.w3.org/2000/svg";
  var left=remaining===0?0:Math.max(1,Math.ceil(remaining/REASONS.length*30));
  notesG.innerHTML="";
  var rows=Math.ceil(left/5);
  for(var k=0;k<left;k++){
    var row=Math.floor(k/5), col=k%5;
    var x=58+col*32+(row%2?14:0)+((k*37)%9)-4;
    var y=284-row*20-((k*13)%7);
    var r=document.createElementNS(ns,'rect');
    r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',30);r.setAttribute('height',12);r.setAttribute('rx',3);
    r.setAttribute('fill',COLORS[k%COLORS.length]);r.setAttribute('stroke','rgba(194,77,120,.25)');
    r.setAttribute('transform','rotate('+(((k*47)%50)-25)+' '+(x+15)+' '+(y+6)+')');
    notesG.appendChild(r);
  }
}
function updateCounter(){document.getElementById('counter').textContent= drawn+" из "+REASONS.length+" записок"}
function showNote(i,n){
  var w=document.getElementById('noteWrap');
  w.innerHTML='<article class="note pop" style="transform:rotate('+((n%2?1:-1)*(1+n%3))+'deg)"><p class="num">записка № '+n+'</p><p class="txt"></p></article>';
  w.querySelector('.txt').textContent=REASONS[i];
}
function showDone(){
  var w=document.getElementById('noteWrap');
  w.innerHTML='<div class="done"><p class="big">Банка пустая, а причин у меня всё равно больше.</p><p>Я тебя люблю, зайка.</p><button class="btn" id="again" type="button">Сложить записки обратно</button></div>';
  document.getElementById('again').addEventListener('click',reset);
}
var jar=document.getElementById('jar');
jar.addEventListener('click',function(){
  jar.classList.remove('shake');void jar.offsetWidth;jar.classList.add('shake');
  if(drawn>=REASONS.length){showDone();return}
  var i=order[drawn];drawn++;
  drawJar();updateCounter();showNote(i,drawn);
});
reset();
</script>

</body></html>
